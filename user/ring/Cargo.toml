# user-ring —— 异步环的用户态验收程序：独立的静态 ELF，只经系统调用（含 system.async.ring.*）与内核交互；
# 记录布局取自 kernel-core 的 ring_abi（与内核同一份定义），调用号在构建期从 abi/system-ids.txt 生成。
[package]
name = "user-ring"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "user-ring"
path = "src/main.rs"
test = false
bench = false

[dependencies]
kernel-core = { path = "../../kernel-core" }

[build-dependencies]
kernel-core = { path = "../../kernel-core" }
