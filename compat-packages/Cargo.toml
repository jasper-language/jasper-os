[package]
name = "jasper-compat-packages"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Atomic management of unmodified Linux compatibility components"

[lib]
name = "jasper_compat_packages"
path = "src/lib.rs"

[[bin]]
name = "jasper-compat-pkg"
path = "src/main.rs"

[dependencies]
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["alloc"] }
semver = "=1.0.28"
tar = { version = "=0.4.46", default-features = false }
