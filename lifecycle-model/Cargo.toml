[package]
name = "jasper-lifecycle-model"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Executable LC-0 lifecycle and boot-control model"

[lib]
name = "jasper_lifecycle_model"
path = "src/lib.rs"

[dependencies]
jasper-lifecycle-boot = { path = "../lifecycle-boot" }
ciborium = { version = "=0.2.2", default-features = false }
crc32fast = { version = "1.4.2", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "=0.11.1", default-features = false }
