# =============================================================================
# ci.yml —— 公开仓库的自动化验证（每次推送与拉取请求）
# Automated verification of the public repository on every push and pull request.
#
# 职责：在托管运行器上从干净检出重做本地一键验收所做的全部事情，结果作为提交的状态检查公开可见。
#   1. host  ：工作区宿主测试（kernel-core、jaso 格式与打包），以及 kernel-core 在 32 位（i686）与
#              AArch64 / RISC-V64（经 qemu-user）上的单元测试——尽早给出信号
#   2. accept：scripts/accept.sh 全量：裸机构建、x86_64 / AArch64 / RISC-V64 三次 QEMU 真实启动、逐里程碑判定；
#              证据目录作为构件上传，失败时也上传，便于对照原始串口日志
# 边界：只调用仓库内的脚本，判据全部在 scripts/accept.sh 里，本文件不复制、不放宽任何判据；
#       工具链钉到与本地验收相同的 nightly 日期，避免上游每日变化让结果不可复现。
# 运行范围：公开仓库的每次推送与拉取请求；开发仓库只在 verify/* 分支运行（用于开发机暂时不能本地跑 QEMU 时），
# 其余分支不运行，避免重复消耗托管运行器时长与产生重复的检查结果。
# =============================================================================
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地验收相同的工具链（rustc 1.101.0-nightly 5d8fec066 2026-10-16）；升级时与本地一起改。
  # Same pinned nightly as local acceptance; bump both together.
  RUST_NIGHTLY: nightly-2026-10-17
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  host:
    name: host tests (64/32-bit, AArch64, RISC-V64)
    # 公开仓库的每次推送；以及开发仓库中 verify/* 分支（开发机上暂停本地 QEMU 期间，用托管运行器做验收）
    if: github.repository == 'jasper-language/jasper-os' || startsWith(github.ref, 'refs/heads/verify/')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装 qemu-user（跨指令集运行单元测试） / install qemu-user
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-user
      - name: 工具链 / toolchain
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rust-src,llvm-tools-preview \
            --target x86_64-unknown-none,x86_64-unknown-uefi,aarch64-unknown-none,aarch64-unknown-none-softfloat,riscv64gc-unknown-none-elf,riscv64imac-unknown-none-elf,riscv32imac-unknown-none-elf,i686-unknown-linux-musl,aarch64-unknown-linux-musl,riscv64gc-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_NIGHTLY" >> "$GITHUB_ENV"
      - run: rustc -Vv && cargo -V
      - name: ABI 契约快照与历史不可变性 / ABI contract snapshots
        env:
          ABI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/abi-contract.sh check
          if [ -n "${ABI_BASE_SHA:-}" ] && ! [[ "$ABI_BASE_SHA" =~ ^0+$ ]]; then
            bash scripts/abi-contract.sh immutable "$ABI_BASE_SHA"
          else
            echo "没有可比较的 ABI 历史 base；当前工作树仍已通过完整快照一致性检查"
          fi
      - name: Issue #33/#35 硬编码增量门与存量审计 / hardcoding gates
        env:
          HARDCODE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/check-hardcode-gate.py --self-test
          python3 scripts/check-hardcode-gate.py --base "${HARDCODE_BASE:-}"
          python3 scripts/check-hardcode-gate.py --inventory
      - name: Issue #36/#37 GPU 与 UI ABI 边界 / GPU-UI boundary
        run: |
          python3 scripts/check-gpu-abi-boundary.py --self-test
          python3 scripts/check-gpu-abi-boundary.py
          python3 scripts/check-linux-graphics-compat.py
      - name: LC-5 可重复 SBOM / deterministic SBOM
        run: |
          python3 scripts/release-sbom.py --check --output target/jasper-os-sbom.cdx.json
      - name: LC-5 可重复构建 / reproducible kernel build
        run: |
          JASPER_REPRO_JOBS=2 bash scripts/release-repro-check.sh
      - name: LC-5 发布通道与漏洞响应策略 / release policy
        run: |
          python3 scripts/check-release-policy.py
          python3 scripts/check-vulnerabilities.py
          python3 scripts/check-vulnerabilities.py \
            --file release/vulnerabilities.example.toml
      - name: LC-5 持久撤销快照 / persistent revocation snapshot
        run: |
          bash scripts/release-revocations-check.sh
      - name: LC-5 签名发布、信任轮换与多源演练 / signed release supply drill
        run: |
          bash scripts/release-supply-check.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ env.RUST_NIGHTLY }}-${{ hashFiles('Cargo.lock') }}
      - name: kernel-core 宿主测试（64 位） / kernel-core host tests
        run: cargo test -p kernel-core
      - name: 兼容层核心单元测试 / compatibility core unit tests
        run: |
          CARGO_BUILD_JOBS=2 cargo test -p jasper-compat-core \
            -p jasper-compat-loader \
            -p jasper-compat-packages \
            -p jasper-compat-graphics \
            -p jasper-lifecycle-model \
            -p jasper-lifecycle-staging
      - name: 真实上游兼容组件安装 / real upstream component install
        run: CARGO_BUILD_JOBS=2 bash scripts/compat-package-real.sh
        env:
          COMPAT_PACKAGE_REAL_DIRECT_CARGO: "1"
      - name: jaso 格式与打包测试 / jaso tests
        run: cargo test -p jaso --features pack
      - name: kernel-core 单元测试（32 位 i686、AArch64、RISC-V64） / cross-ISA unit tests
        run: |
          set -e
          for pair in i686-unknown-linux-musl: aarch64-unknown-linux-musl:qemu-aarch64 riscv64gc-unknown-linux-musl:qemu-riscv64; do
            t="${pair%%:*}"; q="${pair#*:}"
            var="CARGO_TARGET_$(echo "$t" | tr 'a-z-' 'A-Z_')"
            echo "== $t ${q:-(native)} =="
            env "${var}_LINKER=rust-lld" ${q:+"${var}_RUNNER=$q"} \
              RUSTFLAGS="-C link-self-contained=yes -C target-feature=+crt-static" \
              CARGO_TARGET_DIR=target/isa-test cargo test -p kernel-core --target "$t"
          done
      - name: Pixel 6a 物理运行计划可构建 / Pixel 6a runtime plan build
        run: |
          CARGO_BUILD_JOBS=2 cargo build --locked --release \
            --target aarch64-unknown-none-softfloat \
            -p jasper-kernel --no-default-features \
            --features pixel6a-runtime-verify
      - name: 上传 Pixel 6a 运行 ELF / upload Pixel 6a runtime ELF
        uses: actions/upload-artifact@v4
        with:
          name: pixel6a-runtime-elf
          path: target/aarch64-unknown-none-softfloat/release/jasper-kernel
          if-no-files-found: error

  accept:
    name: accept (x86_64 + AArch64 + RISC-V64 QEMU)
    # 公开仓库的每次推送；以及开发仓库中 verify/* 分支（开发机上暂停本地 QEMU 期间，用托管运行器做验收）
    if: github.repository == 'jasper-language/jasper-os' || startsWith(github.ref, 'refs/heads/verify/')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 安装 QEMU / install QEMU
        # Hosted-runner package mirrors can take >12 minutes for the ~100 MiB
        # QEMU/OVMF payload.  Keep a bounded timeout, but do not confuse a slow
        # package mirror with a kernel acceptance failure.
        # 托管运行器的软件包镜像下载约 100 MiB 的 QEMU/OVMF 时可能超过 12 分钟；
        # 保留有界超时，但不把镜像慢误判为内核验收失败。
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Dpkg::Options::=--force-confdef
            -o Dpkg::Options::=--force-confold
          )
          sudo -E apt-get "${apt_options[@]}" update -q
          sudo -E apt-get "${apt_options[@]}" install -y -q --no-install-recommends \
            qemu-system-x86 qemu-system-arm qemu-system-misc opensbi qemu-user ovmf \
            e2fsprogs dosfstools gdisk binutils
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1
          qemu-system-riscv64 --version | head -1
          qemu-system-riscv32 --version | head -1
      - name: 工具链 / toolchain
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rust-src,llvm-tools-preview \
            --target x86_64-unknown-none,x86_64-unknown-uefi,aarch64-unknown-none,aarch64-unknown-none-softfloat,riscv64gc-unknown-none-elf,riscv64imac-unknown-none-elf,riscv32imac-unknown-none-elf,i686-unknown-linux-musl,aarch64-unknown-linux-musl,riscv64gc-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_NIGHTLY" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: accept-${{ env.RUST_NIGHTLY }}-${{ hashFiles('Cargo.lock') }}
      - name: LC-2 原生恢复命令真实 UEFI / native recovery UEFI
        # QEMU itself has a 360-second guest budget.  This outer bound catches
        # inherited pipe/child-process leaks that would otherwise hold the step
        # open until the 90-minute job timeout.
        # QEMU 客户机预算为 360 秒；外层上限捕获可能继承管道的子进程泄漏。
        timeout-minutes: 20
        env:
          JASPER_BUILD_CPUS: 0-1
          ISSUE21_UEFI_MODE: terminal-recovery
          ISSUE21_QEMU_CPUS: 0-1
          ISSUE21_QEMU_SMP: "2"
          ISSUE21_QEMU_MEMORY: 1G
          ISSUE21_UEFI_TIMEOUT: "360"
        run: bash scripts/issue21-uefi-boot-check.sh
      - name: 一键验收 / scripts/accept.sh
        env:
          # 托管运行器只有少量核且没有硬件虚拟化：用全部核，QEMU 时限放宽（判据本身不变）。
          JASPER_ACCEL: tcg
          JASPER_QEMU_TIMEOUT: "600"
        run: JASPER_CORES="0-$(( $(nproc) - 1 ))" bash scripts/accept.sh
      - name: 上传证据 / upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accept-evidence
          path: evidence/
          retention-days: 30
