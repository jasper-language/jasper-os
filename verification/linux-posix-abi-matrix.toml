schema = 1
scope = "compat-linux-posix"
baseline = "Ubuntu Linux x86_64"
updated = "2026-11-22"

# This file is the reusable ledger for the compatibility ABI surface exposed to
# Linux/POSIX programs. A mapped syscall is not a verified ABI item. Wine is a
# discovery workload: it may add evidence to rows, but it cannot promote the
# complete compatibility surface by itself.

[[item]]
id = "linux-syscall-number-dispatch"
abi = "Linux x86_64 syscall numbers"
positive_coverage = "all 385 entries have a mapped or explicit pre-dispatch disposition"
negative_coverage = "removed entries fail with ENOSYS and privileged entries fail closed with EPERM where specified"
evidence = "scripts/check-linux-syscall-disposition.py; verification/linux-android-abi-status.md"
commit = "409c6e2"
environment = "source-disposition"
status = "mapped"

[[item]]
id = "linux-vfs-path-resolution"
abi = "openat/stat/readlink/realpath pathname resolution"
positive_coverage = "absolute, relative, dot, dot-dot, repeated separator, symlink, writable cache paths, Wine PE import closure and NLS files"
negative_coverage = "missing paths, non-link readlink EINVAL, and attempted escape above compatibility root"
evidence = "verification/compat-abi-evidence.md"
commit = "409c6e2"
environment = "qemu-jasper-linux-abi"
status = "partial"

[[item]]
id = "linux-file-status-and-mode"
abi = "open/create/stat/umask file mode and descriptor status flags"
positive_coverage = "regular and cache files expose Linux modes, umask, writable O_ACCMODE status, /tmp mode 01777, and standard streams expose character-device stat metadata"
negative_coverage = "descriptor access rights reject operations not granted by the open description; fstat rejects negative and unopened descriptors with EBADF"
evidence = "verification/compat-abi-evidence.md"
commit = "409c6e2"
environment = "qemu-jasper-linux-abi"
status = "partial"

