schema = 1
baseline = "04f7391"
scope = "stage-a-research-contract"
implementation_claim = "current-modular-monolith-only"

[identity]
required_scopes = [
  "hardware-cpu-id",
  "logical-cpu-id",
  "numa-domain",
  "device-id-generation",
  "memory-object-id",
  "remote-object-id",
]
silent_truncation = "forbidden"
stale_identity = "reject"

[coordination]
levels = ["per-cpu", "local-domain", "cross-domain-or-node"]
ordinary_local_cost = "o1-goal"
cross_node_memory = "explicit-protocol-not-shared-pointer"

[performance]
required_quantiles = ["p50", "p99", "p99.9", "p99.99", "max"]
required_environment = [
  "commit",
  "build-profile",
  "hardware",
  "firmware",
  "topology",
  "numa-distance",
  "smt",
  "memory",
  "host-or-bare-metal",
  "cpu-affinity",
  "host-load",
  "clock-domain",
  "sample-count",
]
complexity_does_not_imply_tail_latency = true
fanout_distributions_separate = true

[[source_constraints]]
id = "TOPO-01"
file = "kernel-core/src/smp.rs"
patterns = ["pub const MAX_CPUS: usize = 32", "pub struct CpuSet(u32)"]

[[source_constraints]]
id = "TOPO-02"
file = "kernel-core/src/smp.rs"
patterns = ["pub struct Topology", "pub dropped: usize", "pub fn hw_id", "pub fn index_of"]

[[source_constraints]]
id = "TOPO-03"
file = "kernel/src/arch/x86_64/smp.rs"
patterns = ["[AtomicU8; 256]", "req.hw_id >= 256"]

[[source_constraints]]
id = "TOPO-04"
file = "kernel/src/sched/mod.rs"
patterns = ["static KERNEL_SCHED: IrqSpinLock<Scheduler>"]

[[source_constraints]]
id = "TOPO-05"
file = "kernel/src/mm/frame.rs"
patterns = ["static ALLOCATOR: Once<IrqSpinLock"]

[[source_constraints]]
id = "TOPO-05"
file = "kernel/src/mm/heap.rs"
patterns = ["static HEAP: IrqSpinLock<HeapState>"]

[[source_constraints]]
id = "TOPO-06"
file = "kernel-core/src/smp.rs"
patterns = ["pub struct ShootdownBoard"]

[[source_constraints]]
id = "TOPO-07"
file = "kernel-core/src/environment.rs"
patterns = ["pub enum ResourceKind { Cpu, Gpu, Accelerator, MemoryBandwidth }"]

