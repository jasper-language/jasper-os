# kernel-core —— jasper-os 的「纯机制」库（M1.5）。
#
# 职责：对象/权限/句柄表、等待、异步 ring 形状的 I/O、地址空间记账、模块装配、
# 陷入分发、结构化追踪、自旋锁。只含类型与逻辑，不碰任何硬件。
# 为什么单独成 crate：`no_std` 且无 ISA 依赖 ⇒ 可以在宿主上 `cargo test -p kernel-core`，
# 机制的正确性用单元测试锁死；内核（kernel/）只负责把它接到真实硬件上运行。
# 刻意零依赖：机制层不应被第三方 crate 的 feature/版本牵着走。
[package]
name = "kernel-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "kernel_core"
path = "src/lib.rs"

[dependencies]
crc = { version = "3", optional = true }
ext4-view = { version = "1.0.0", default-features = false, optional = true }
ext4_rs = { path = "../third_party/ext4_rs", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
# FS-1 read-only ext4 VFS plus JBD2 recovery overlay.
ext4-view = ["dep:crc", "dep:ext4-view"]
# Experimental FS-1 write engine: buffered ext4_rs metadata operations committed
# through Jasper's own JBD2 writer.
ext4-write = ["ext4-view", "dep:ext4_rs"]
# Author: chatgpt. Isolated capacity validation; default capacity bounds unchanged.
evt1-capacity = []
# SEC-1 dedicated acceptance hooks; never enabled in production profiles.
sec1-verify = []
# SEC-3 dedicated acceptance hooks for label mutation and policy checks.
sec3-verify = []
# Opt-in Kani harnesses for the native ABI generation contract (issue #8).
# 默认 Kani 套件不包含这些证明，避免改变既有 FV-1 harness 计数。
abi-fv = []
