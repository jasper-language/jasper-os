# kernel-core —— jasper-os 的「纯机制」库（M1.5）。
#
# 职责：对象/权限/句柄表、等待、异步 ring 形状的 I/O、地址空间记账、模块装配、
# 陷入分发、结构化追踪、自旋锁。只含类型与逻辑，不碰任何硬件。
# 为什么单独成 crate：`no_std` 且无 ISA 依赖 ⇒ 可以在宿主上 `cargo test -p kernel-core`，
# 机制的正确性用单元测试锁死；内核（kernel/）只负责把它接到真实硬件上运行。
# 刻意零依赖：机制层不应被第三方 crate 的 feature/版本牵着走。
[package]
name = "kernel-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "kernel_core"
path = "src/lib.rs"

[dependencies]
crc = { version = "3", optional = true }
ext4-view = { version = "1.0.0", default-features = false, optional = true }
ext4_rs = { path = "../third_party/ext4_rs", optional = true }
wireguard-sans-io = { version = "=1.0.0", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[[test]]
name = "sandbox_lifecycle"
path = "tests/sandbox_lifecycle.rs"
required-features = ["runtime-registries"]

[[test]]
name = "workload_io_quota"
path = "tests/workload_io_quota.rs"
required-features = ["runtime-registries"]

[[test]]
name = "workload_io_rate"
path = "tests/workload_io_rate.rs"
required-features = ["runtime-registries"]

[[test]]
name = "workload_ring_quota"
path = "tests/workload_ring_quota.rs"
required-features = ["runtime-registries"]

[features]
# Runtime-sized networking state requires the caller's allocator. User
# programs that only share ABI/layout types keep the default allocation-free
# surface.
network-dynamic = []
# Firmware tables are parsed into runtime-sized inventories by the kernel;
# user ABI crates keep the allocation-free default surface.
acpi-dynamic = []
# Terminal rings are sized from the admitted runtime memory budget and require
# the caller's allocator.
terminal-dynamic = []
# Runtime-sized native display input queues use the kernel allocator; user ABI
# crates retain the allocation-free display contract.
display-dynamic = []
# Per-vCPU guest mapping tables are allocated from the admitted kernel heap.
hwvirt-vcpu-dynamic = []
# Virtio-GPU resource metadata follows the admitted per-session budget in the
# kernel. User ABI crates retain the allocation-free protocol surface.
gpu-dynamic = []
# Native Profile resolution, module assembly and module lifecycle use heap-backed
# metadata in the kernel. User ABI crates keep the allocation-free default surface.
runtime-registries = []
# Compatibility mechanism adapters retain a bounded fixed-capacity provenance
# table for host-testable state machines. The production kernel uses the
# heap-backed table admitted through runtime-registries.
compat-native-bounded = []
# Device interrupt routing and throttling tables follow the complete platform
# inventory instead of a fixed line-count envelope.
irq-dynamic = []
# Firmware CPU identity inventories use heap-backed topology records in the
# kernel. User ABI crates retain the allocation-free bitmap surface.
cpu-dynamic = []
# Persistent installation requires the kernel heap for bounded transactional
# state snapshots; core profiles that do not use it remain allocation-free.
persistent-install = []
# Runtime-sized Driver Host authority receipts use the kernel heap. User ABI
# crates keep the allocation-free default surface.
driver-host-journal = []
# FS-1 read-only ext4 VFS plus JBD2 recovery overlay.
ext4-view = ["dep:crc", "dep:ext4-view"]
# Experimental FS-1 write engine: buffered ext4_rs metadata operations committed
# through Jasper's own JBD2 writer.
ext4-write = ["ext4-view", "dep:ext4_rs"]
# Author: chatgpt. Isolated capacity validation; default capacity bounds unchanged.
evt1-capacity = []
# SEC-1 dedicated acceptance hooks; never enabled in production profiles.
sec1-verify = []
# SEC-3 dedicated acceptance hooks for label mutation and policy checks.
sec3-verify = []
# Opt-in Kani harnesses for the native ABI generation contract (issue #8).
# 默认 Kani 套件不包含这些证明，避免改变既有 FV-1 harness 计数。
abi-fv = []
