# jasper-kernel —— 内核二进制：把 kernel-core 的纯机制接到真实硬件（经 arch::Platform）。
# 依赖版本取自前期已验证的原型。
[package]
name = "jasper-kernel"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
kernel-core = { path = "../kernel-core" }
jasper-lifecycle-boot = { path = "../lifecycle-boot" }
# Compatibility crates are optional services. Native Jasper profiles must link
# neither crate and must remain buildable when these components are absent.
# 兼容 crate 属于可选服务；原生 Jasper Profile 不链接它们，并可在组件缺失时构建。
jasper-compat-loader = { path = "../compat-loader", optional = true }
compat-core = { package = "jasper-compat-core", path = "../compat-core", optional = true }
spin = "0.12.3"
ed25519-dalek = { version = "=3.0.0", default-features = false }
crc = "=3.4.0"

# 只在 x86_64 上使用：引导协议、描述符表 / 页表封装、8259 PIC。其它指令集的平台代码不依赖第三方 crate。
[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader_api = "0.11.17"
x86_64 = "0.15.5"
pic8259 = "0.11.0"
noto-sans-mono-bitmap = { version = "0.2.0", optional = true, default-features = false, features = ["regular", "size_16", "unicode-basic-latin"] }

[features]
rt3-verify = ["user-programs"]
rt1-verify = ["user-programs"]
rt2-verify = ["user-programs"]
rt1-no-realtime = ["rt1-verify"]
budget-window-verify = []
# Dedicated KRN-3 AP tick ownership/accounting guest; default unchanged.
krn3-fast-tick-verify = []
# Dedicated post-split scheduler ledger: initialize SMP, then run only the
# scaling/correctness drill so unrelated user-space and soak demos cannot hide
# the KRN-3 result behind their timeout or serial volume.
krn3-postsplit-verify = []
# Dedicated complete wake/resume latency sampling guest. The workload records
# more than 1,000 observations so p99.9 is defined without truncation.
krn3-p999-verify = ["krn2-observe"]
# Diagnostic-only nohz ledger and isolated guest; default unchanged.
s3-nohz-verify = []
evt2-verify = ["user-programs"]
evt2-broadcast-verify = []
shm1-verify = ["user-programs", "fault-inject"]
# Dedicated HWV-1 vCPU/EPT/NPT lifecycle drill; never enters VMX/SVM.
hwv1-verify = []
# Dedicated Intel VMX VMCS/VM-Entry/VM-Exit drill; requires nested Intel VMX.
hwv2-verify = []
# Dedicated AMD SVM VMCB/NPT/VM-Exit drill. On non-AMD hosts this verifies the
# fail-closed VMCB contract and explicitly reports hardware=false.
hwv3-verify = []
# Dedicated HWV-4 first checkpoint: VM exits through a real Ring, cancel and
# single-terminal checks, plus the virtual PIC/IOAPIC/PIT contract.
hwv4-verify = []
# Embed a real x86_64 Linux kernel for the HWV-4 minimal-guest acceptance.
# The artifacts are supplied by JSR_LINUX_GUEST_HEADER and
# JSR_LINUX_GUEST_KERNEL and are intentionally not checked into the repo.
hwv4-linux = ["hwv4-verify"]
# HWV-5 guest-facing virtio-MMIO devices and minimal Linux acceptance.
hwv5-verify = ["hwv4-linux", "user-programs"]
# Production PEP/runtime lease drill without network/FUSE Linux artifacts.
hwv5-prod-verify = []
# JASO-1 multi-image and source-envelope acceptance only.
jaso1-verify = []
# DRV-3 DMA mapping lifecycle drill.
drv3-verify = []
# Dedicated PEX-0 workload: existing low/medium/high drills plus parallel
# multi-process, multi-Ring throughput measurements.
pex0-verify = ["user-programs"]
# Dedicated scheduler transaction categorization matrix.
pex1-verify = ["user-programs", "krn2-observe"]
# Dedicated independent-Ring and cross-process contention matrix.
pex2-verify = []
# Dedicated central-versus-sharded object-table A/B evaluation.
pex3-verify = []
# Dedicated local selection-path density and latency probe.
pex4-verify = []
# Dedicated real-kernel heap growth and mapping-tail matrix.
pex5-verify = []
# Dedicated real-kernel frame allocation, cross-CPU release and reclaim matrix.
pex7-verify = []
workload-verify = []
# Real CPL3 Linux file/console I/O through a Workload-bound Process.
workload-io-verify = ["workload-verify", "linux-abi"]
# Dedicated SEC-1 identity and metadata substrate.
sec1-verify = ["kernel-core/sec1-verify"]
# Dedicated SEC-2 capability-lineage slice; full revocation/in-flight coverage
# remains in progress and is not implied by this feature.
sec2-verify = []
# Dedicated SEC-3 MAC, signed-policy and reliable-audit acceptance.
sec3-verify = ["kernel-core/sec3-verify"]
# Dedicated SEC-4 domain, gateway, compromise and restart boundary.
sec4-verify = []
# Dedicated SEC-5 IFC/DIFC enforcement, declassification and audit acceptance.
sec5-verify = []
# Dedicated production TCP service and authorized network path.
net2-verify = []
# Dedicated network lifecycle, retry, loss and observability contract.
net3-verify = []
# NET-4 no_std UDP socket runtime without hosted QUIC artifacts.
net4-runtime-verify = []
# Linux syscall 兼容服务；只用显式 Linux Profile 引入，默认构建不含该依赖。
# Linux syscall compatibility service. Only explicit Linux profiles enable it.
linux-abi = ["dep:compat-core"]
# Bounded Linux ELF planning and page-table backend as an optional service.
# 有界 Linux ELF 规划与页表后端，仅在显式兼容 Profile 中装配。
compat-elf = ["dep:jasper-compat-loader"]
# Real compat-loader page-table backend and ELF entry handoff using an embedded Jasper image.
compat-elf-backend-verify = ["user-programs", "compat-elf"]
# Linux user-space syscall entry, explicit compatibility flavor and CPL3 probe.
compat-syscall-verify = ["user-programs", "linux-abi"]
# Real unmodified Ubuntu x86_64 PIE, ld-linux and libc execution through the optional
# Linux syscall and ELF compatibility services; no unrelated Jasper user bundle is linked.
compat-dynamic-libc-verify = ["linux-abi", "compat-elf"]
# Unmodified Ubuntu glibc pthread create/join/mutex/condvar path over clone/futex.
compat-pthread-verify = ["compat-dynamic-libc-verify"]
# Unmodified Ubuntu glibc sigaction, tgkill, blocking and nested rt_sigreturn path.
compat-signal-verify = ["compat-dynamic-libc-verify"]
# SEC-6 software memory capabilities, pointer provenance and CHERI-ready boundary.
sec6-verify = []
# Dedicated USI-1 CLI/structured service acceptance.
usi1-verify = ["user-programs"]
# Dedicated USI-2 idempotency, capability events and cancellation acceptance.
usi2-verify = ["user-programs"]
# Dedicated ARCH-2 user-space driver death/restart and resource-reclamation proof.
arch2-verify = ["user-programs"]
# BLK-1 real virtio-blk persistence and lifecycle drill.
blk1-verify = []
# FS-0 journal-to-virtio-blk integration and same-disk power-cut drill.
fs0-journal-verify = []
# Real virtio-blk persistence of package bytes and installation state across reboot.
native-install-block-verify = []
# FS-1 real ext4 VFS read/write/fsync/rename over virtio-blk.
fs1-ext4-verify = ["kernel-core/ext4-write"]
# Dedicated MOD-1 contract: assembly ordering, publication and runtime stop/health.
mod1-verify = []
# Author: chatgpt. Optional diagnostic counters; absent from default builds.
krn2-observe = []
# Author: chatgpt. Dedicated event-wait mechanism guest, not enabled in production.
evt1-verify = ["kernel-core/evt1-capacity"]
# Dedicated guest: full-table check of the deadline dirty-set invariant after every refresh.
ns-dirty-audit = []
# Explicitly armed KRN-1 fault sites; default builds contain no hooks.
fault-inject = []
# Dedicated boot-stage negative guest: inject an assembly activation failure,
# exercise boot rollback, and verify blocked/duplicate transitions in the real kernel.
boot-stage-rollback-verify = ["fault-inject"]
# S-2 fixed-seed eight-process syscall campaign (opt-in).
s2-fuzz = ["user-programs"]
# Dedicated S-2 guest: initialize the platform and scheduler, then run the
# campaign without unrelated demos that depend on single-vCPU TCG timing.
s2-only = ["s2-fuzz", "fault-inject"]
# Independent opt-in long-run guest; not enabled by default or acceptance.
krn1-soak = ["user-programs"]
# Short KRN-3 interoperability campaign used by milestone S-4.
s4-soak = ["fault-inject", "krn2-observe"]
# Explicit QEMU BM-1 profile: RTL8139 log link, IB700 watchdog and CF9 reset.
bm1-vm = ["dep:noto-sans-mono-bitmap"]
bm1-hang = ["bm1-vm"]
default = ["user-programs"]
# 生产启动（issue #7）：只执行全局阶段和第一个用户程序，然后等待服务，不退出模拟器。不能和验收特性同开。
production = []
# P0 A/B 最小生产健康门：从 Jasper virtio-blk P0 控制分区恢复记录并持久确认当前槽。
lifecycle-ab-health = ["kernel-core/ext4-view"]
# Dedicated negative acceptance: reach the health gate without enabling production features.
lifecycle-health-fail-verify = ["lifecycle-ab-health"]
# Dedicated acceptance: load and execute the static Linux health probe from the selected System root.
lifecycle-root-exec-verify = ["lifecycle-health-fail-verify", "linux-abi", "compat-elf"]
# Dedicated negative acceptance: lose the first virtio-blk completion and require
# the hardware-counter timeout to fail the health gate without hanging silently.
lifecycle-block-timeout-verify = ["lifecycle-root-exec-verify", "fault-inject"]
# Dedicated console-input acceptance: a dynamic Linux program consumes serial
# bytes through the bounded native terminal session.
terminal-session-verify = []
# Pixel 6a (Google Tensor GS101) early-boot probe: Samsung UART only, no scheduler/IRQ start.
pixel6a-smoke = []
pixel6a-entry-probe = ["pixel6a-smoke"]
pixel6a-pe = []
pixel6a-full = []
pixel6a-full-probe = ["pixel6a-full"]
pixel6a-gic-init-probe = ["pixel6a-full"]
pixel6a-before-kmain-probe = ["pixel6a-full"]
pixel6a-smp-probe = ["pixel6a-full"]
# 构建期配置档：默认 standard；启用本特性得到 compact（参数见 kernel-core 的 config 模块）。
profile-compact = []
# 构建期调度策略：默认分时策略；启用本特性改用纯轮转（不分级、固定时间片）。
sched-rr = []
# 内嵌用户程序（以本内核的目标指令集构建）并运行依赖它们的验收演练；关闭时只运行内核任务与探针机器码的演练。
user-programs = []
# 验收专用：让规模化演练额外注入一条必然失败的功能断言，用来证明「人为功能失败仍判失败」。
# 默认关闭，只在验收脚本构建镜像时启用；内核其他位置不读取本特性。
selftest-inject-failure = []

[build-dependencies]
# 构建期复用 kernel-core 的登记表解析与校验（宿主上编译，零依赖）。
kernel-core = { path = "../kernel-core" }

[lib]
name = "jasper_kernel"
path = "src/lib.rs"

[[bin]]
name = "jasper-kernel"
path = "src/main.rs"
