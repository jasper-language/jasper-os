[package]
name = "jasper-lifecycle-staging"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Verified, durable artifact staging for the Jasper lifecycle service"

[dependencies]
jasper-lifecycle-model = { path = "../lifecycle-model" }
gpt = { version = "=4.1.0" }
fatfs = { version = "=0.3.6", default-features = false, features = ["std", "alloc"] }
libc = { version = "=0.2.191" }
rustix = { version = "=1.1.5", features = ["fs"] }
sha2 = { version = "=0.11.1", default-features = false }
uuid = { version = "=1.28.0", features = ["v4"] }
