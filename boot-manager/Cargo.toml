[package]
name = "jasper-boot-manager"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "UEFI slot selector for Jasper-OS P0 installations"

[dependencies]
bootloader-boot-config = "=0.11.17"
bootloader-x86_64-common = "=0.11.17"
bootloader_api = "=0.11.17"
jasper-lifecycle-boot = { path = "../lifecycle-boot" }
log = "=0.4.29"
sha2 = { version = "=0.11.1", default-features = false }
uefi = { version = "=0.38.0", features = ["alloc", "global_allocator"] }
x86_64 = "=0.15.5"
