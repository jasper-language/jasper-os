[package]
name = "jasper-trust-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Bounded software-attestation collector, broker, verifier and policy service"

[lib]
name = "jasper_trust_service"
path = "src/lib.rs"

[dependencies]
ciborium = { version = "=0.2.2", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false }
jaso = { path = "../jaso", features = ["alloc", "sign"] }
kernel-core = { path = "../kernel-core" }
sha2 = { version = "=0.11.1", default-features = false }
